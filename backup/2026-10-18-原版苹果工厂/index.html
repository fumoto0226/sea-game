function renderDetails(){if(!selected){$('details').innerHTML='';return}const n=nodes().find(n=>n.id===selected);const locked=!available(n),done=maxed(n),disabled=locked||done||s.coins<cost(n);const text=locked?'先解锁「'+nodes().find(x=>x.id===n.parent).title+'」':done?'已升满 '+level(n)+'/'+n.max:fmt(cost(n))+' 金币 · '+(level(n)?'升级':'解锁');const html=`<strong>${n.title}</strong><p>${desc(n)}</p><button data-buy="${n.id}" ${disabled?'disabled':''}>${text}</button>`;if($('details').dataset.content!==html){$('details').dataset.content=html;$('details').innerHTML=html}}
function renderModal(){if(!modal)return;$('dialogTitle').textContent={tree:s.active==='apple'?'苹果园 · 升级树':'苹果汁厂 · 升级树',supply:'补给扭蛋',challenge:'十分钟挑战',odds:'概率与加工规则'}[modal];if(modal==='odds'){const key='odds'+JSON.stringify(s.skills)+s.active;if(panelKey!==key){panelKey=key;$('dialogContent').innerHTML=`<p class="note">每次点击都有进度，成品品质独立随机。</p>${clickOdds(s.active).map(q=>`<p class="note">${q.label} · ${fmt(q.p*100)}% 概率 · +${fmt(power(current())*q.mult)}% 进度</p>`).join('')}<p class="note">苹果品质与当前售价：</p>${appleOdds().map(q=>`<p class="note" style="color:${q.color}">${q.label} · ${q.price} 金币 · ${fmt(q.p*100)}%</p>`).join('')}<p class="note">外购苹果固定 5 金币/个。每轮果汁消耗 5 苹果。产品物流开启时，损坏、劣质、普通苹果留作原料。在线自动生产会在另一工厂继续运行，缺料时暂停。</p>`}return}if(modal==='tree'){const key=JSON.stringify([modal,s.active,s.skills,s.apple,s.juice,s.juiceUnlocked,s.selfSupply,s.appleMode,selected],(k,v)=>k==='progress'?undefined:v);if(panelKey!==key){panelKey=key;const sc=document.querySelector('.tree-scroll'),left=sc?.scrollLeft,top=sc?.scrollTop||0;$('dialogContent').innerHTML=treeHTML();drawLines();const next=document.querySelector('.tree-scroll');next.scrollTop=top;next.scrollLeft=left??Math.max(0,($('node-'+s.active+'-repair')?.offsetLeft||0)-next.clientWidth/2+50)}renderDetails();return}
if(modal==='supply'){const key=JSON.stringify([modal,s.draws,s.energy,!!burst,s.outfits,s.wear]);if(panelKey!==key){panelKey=key;$('dialogContent').innerHTML=`<p class="note">必得 ${300+100*s.draws} 作业能量，另有 35% 概率获得服装。每抽一次，下次价格增加约 22%；不抽不涨价。</p><div class="item"><strong>第 ${s.draws+1} 次补给</strong><button data-action="draw" id="draw"></button></div><div class="energy"><div class="row"><strong>作业能量</strong><span>${fmt(s.energy)} 点</span></div><p class="note">100 点完成一份产品。苹果汁每轮仍需 5 苹果，缺料时剩余能量退回。</p><button data-action="energy" ${!s.energy||burst?'disabled':''}>${burst?'正在生产…':'全部使用 · '+name(s.active)}</button></div><p class="note">服装仅改变角色外观。重复服装转成 200 能量。</p><div class="wardrobe">${s.outfits.map(o=>`<button data-wear="${o}" class="outfit ${s.wear===o?'chosen':''}">${o}</button>`).join('')}</div>`} $('draw').textContent=fmt(drawCost())+' 金币 · 抽一次';$('draw').disabled=s.coins<drawCost();return}
const c=s.challenge,key=JSON.stringify([modal,c&&Math.floor(c.remaining),c?.score,s.best]);if(panelKey===key)return;panelKey=key;$('dialogContent').innerHTML=`<p class="note">从相同初始农场开始，挑战十分钟累计收入。花费不扣分，普通农场会保留，结束后恢复。仅记录本机成绩。</p>`+(c?`<p>剩余 ${Math.floor(c.remaining/60)}:${String(Math.floor(c.remaining%60)).padStart(2,'0')} · 收入 ${fmt(c.score)}</p><button data-action="end">结束并恢复农场</button>`:`<p>最佳成绩 ${fmt(s.best)} 金币</p><button data-action="start">开始挑战</button>`)}
function syncWallet(){observedBalance=s.coins;pendingFlights=[];displayedCoins=s.coins;displayTarget=s.coins;lastCoinText='';updateWallet(0)}
function endChallenge(){const c=s.challenge;if(!c)return;const score=c.score,best=Math.max(s.best,score);s={...c.backup,best,challenge:null};stopHold();burst=0;syncWallet();save();render();toast('挑战结束：'+fmt(score)+' 金币')}
$('dialogContent').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.node){selected=b.dataset.node;renderModal();$('details').scrollIntoView({block:'nearest',behavior:'smooth'});return}if(b.dataset.buy){buy(b.dataset.buy);return}if(b.dataset.wear){s.wear=b.dataset.wear;save();render();return}const a=b.dataset.action;if(a==='toggleSupply'){s.appleMode=s.appleMode==='reserve'?'sell':'reserve';panelKey='';}if(a==='draw'&&s.coins>=drawCost()){s.coins-=drawCost();const reward=300+100*s.draws;s.draws++;s.energy+=reward;let msg='获得 '+reward+' 作业能量';if(Math.random()<.35){const o=['船长帽','潜水服','雨衣'][Math.floor(Math.random()*3)];if(s.outfits.includes(o)){s.energy+=200;msg+='，重复服装 +200 能量'}else{s.outfits.push(o);msg+='，新服装「'+o+'」'}}toast(msg)}if(a==='energy'&&!burst){burst=s.energy;burstFactory=s.active;s.energy=0;closeModal();toast('作业能量已装载！')}if(a==='challenge')openModal('challenge');if(a==='start'){s.energy+=burst;burst=0;const backup=JSON.parse(JSON.stringify(s));s={...fresh(),best:s.best,challenge:{remaining:600,score:0,backup}};burst=0;syncWallet();closeModal();toast('十分钟挑战开始！')}if(a==='end')endChallenge();if(a==='reset')restartGame();save();render()});
$('firstUpgrade').onclick=()=>{if(buy('apple-repair')){openModal('tree');toast('设备维修完成！技能树已解锁。')}};$('openTree').onclick=()=>skill('apple','repair')?openModal('tree'):$('firstUpgrade').click();$('openSupply').onclick=()=>openModal('supply');$('closeDialog').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&modal){const all=[...$('overlay').querySelectorAll('button:not(:disabled)')];const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',drawLines);
document.querySelectorAll('[data-factory]').forEach(b=>b.onclick=()=>{stopHold();s.active=b.dataset.factory;$('result').textContent='等待收获';$('productIcon').textContent=s.active==='apple'?'🍎':'🧃';save();render()});
$('buyBulk').onclick=()=>{const cost=25*worth('apple');if(s.coins<cost)return;s.coins=Math.round((s.coins-cost)*100)/100;addStock('purchased',25);save();render();toast('已购入 25 苹果')};$('qualityInfo').onclick=()=>openModal('odds');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(!s.selfSupply)return;s.appleMode=b.dataset.mode;save();render()});$('buyMaterials').onclick=()=>{const n=Math.max(0,5-s.stock),cost=n*worth('apple');if(!n||s.coins<cost)return;s.coins=Math.round((s.coins-cost)*100)/100;addStock('purchased',n);save();render();toast('已购入 '+n+' 苹果')};
function restartGame(){s=fresh();burst=0;burstFactory='apple';lastTap=null;saveTimer=0;stopHold();closeModal();syncWallet();$('fx').replaceChildren();$('result').textContent='等待收获';$('result').style.color='';$('productIcon').textContent='🍎';$('scene').classList.remove('artwork','quality-burst','pop');$('wallet').classList.remove('receiving');save();render();toast('已重新开始')}
$('restart').onclick=restartGame;
$('switchFactory').onclick=()=>{if(!s.juiceUnlocked)return;stopHold();s.active=s.active==='apple'?'juice':'apple';$('result').textContent='等待收获';save();render()};
function stopHold(){held=false;holdExhausted=false;holdElapsed=0;holdTick=0;$('produce').classList.remove('held')}
$('produce').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('produce').setPointerCapture(e.pointerId);const ok=clickProduce();if(ok&&current().hold){held=true;holdExhausted=false;holdElapsed=0;holdTick=0;$('produce').classList.add('held')}render()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('produce').addEventListener(ev,()=>{stopHold();render()});$('produce').addEventListener('contextmenu',e=>e.preventDefault());$('produce').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();clickProduce();render()}});window.addEventListener('blur',()=>{stopHold();save()});document.addEventListener('visibilitychange',()=>{stopHold();save()});
function update(dt){updateWallet(dt);const f=current();if(held){const active=Math.min(dt,Math.max(0,limit(f)-holdElapsed));holdElapsed+=dt;holdTick+=active;const rate=holdRate(f),ticks=Math.floor((holdTick+1e-9)*rate);if(ticks){holdTick=Math.max(0,holdTick-ticks/rate);for(let i=0;i<ticks;i++)if(!clickProduce())break}if(held&&holdElapsed+1e-8>=limit(f)){held=false;holdExhausted=true;$('produce').classList.remove('held')}}if(s.apple.auto)produce('apple',s.apple.auto*dt);if(s.juiceUnlocked&&s.juice.auto&&(s.batch||s.stock>=5))produce('juice',s.juice.auto*dt);if(burst){const n=Math.min(burst,800*dt);const used=produce(burstFactory,n);burst-=used;if(used<n-1e-8){s.energy+=burst;burst=0;toast('原料不足，剩余作业能量已退回。')}}if(s.challenge){s.challenge.remaining=Math.max(0,s.challenge.remaining-dt);if(!s.challenge.remaining)endChallenge()}saveTimer+=dt;if(saveTimer>=2){saveTimer=0;save()}render()}
window.advanceTime=ms=>{for(let left=ms;left>0;left-=50)update(Math.min(left,50)/1000)};window.render_game_to_text=()=>JSON.stringify({...s,modal,selected,held,holdExhausted,holdElapsed,lastTap,holdRate:holdRate(current()),burst,displayedCoins,displayTarget,quality:$('result').textContent,drawCost:drawCost(),autoProgressPerSecond:current().auto,challenge:s.challenge?{remaining:s.challenge.remaining,score:s.challenge.score}:null});function frame(t){update(Math.min((t-last)/1000,.1));last=t;requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></body></html>
